<h1>📊 Visualisation d’un index</h1>

<form method="get">
    <label for="index_id">Choisir un index :</label>
    <select name="index_id" id="index_id">
        {% for idx in all_indexes %}
            <option value="{{ idx.id }}" {% if idx.id|stringformat:"s" == selected_index_id %}selected{% endif %}>
                {{ idx.name }}
            </option>
        {% endfor %}
    </select>
    <button type="submit">Afficher</button>
</form>

{% if chart %}
    <h2>Graphique</h2>
    <img src="data:image/png;base64,{{ chart }}" alt="Graphique index">
{% elif selected_index_id %}
    <p>Aucune donnée disponible pour cet index.</p>
{% endif %}
