<!-- main/templates/components/search_bar.html -->

<form method="get" action="{% url 'main:index_viewer' %}">
  <label for="index_id">🔍 Rechercher un index :</label>
  <select name="index_id" id="index_id">
    {% for idx in all_indexes %}
      <option value="{{ idx.id }}">{{ idx.name }}</option>
    {% endfor %}
  </select>
  <button type="submit">Voir</button>
</form>
