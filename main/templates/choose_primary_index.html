{% extends 'base.html' %}
{% block title %}Choix de l’index{% endblock %}
{% block content %}
  <h2>Choisissez votre index principal</h2>
  {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="index_id">Index disponible :</label>
    <select name="index_id" id="index_id">
      {% for index in indexes %}
        <option value="{{ index.id }}" {% if index == current_index %}selected{% endif %}>{{ index.name }}</option>
      {% endfor %}
    </select>
    <button type="submit">Valider</button>
  </form>
{% endblock %}
